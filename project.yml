# XcodeGen spec. Generate the Xcode project with:  xcodegen generate
# The .xcodeproj is not committed; this file is the source of truth.
name: Planty
options:
  bundleIdPrefix: app.planty
  deploymentTarget:
    iOS: "17.0"
  developmentLanguage: en
  createIntermediateGroups: true

packages:
  Supabase:
    url: https://github.com/supabase/supabase-swift
    from: 2.24.0
  PlantyKit:
    path: Packages/PlantyKit

settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    LOCALIZATION_PREFERS_STRING_CATALOGS: YES
    SWIFT_EMIT_LOC_STRINGS: YES

targets:
  Planty:
    type: application
    platform: iOS
    sources:
      - path: Planty
    configFiles:
      Debug: Config/Planty.xcconfig
      Release: Config/Planty.xcconfig
    info:
      path: Planty/Info.plist
      properties:
        CFBundleDisplayName: Planty
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        CFBundleLocalizations: [en, de, ru]
        UILaunchScreen:
          UIColorName: ""
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        ITSAppUsesNonExemptEncryption: false
        SupabaseURL: $(SUPABASE_URL)
        SupabasePublishableKey: $(SUPABASE_PUBLISHABLE_KEY)
    entitlements:
      path: Planty/Planty.entitlements
      properties:
        com.apple.developer.applesignin: [Default]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.planty.ios
        TARGETED_DEVICE_FAMILY: "1"
        CODE_SIGN_STYLE: Automatic
        ENABLE_PREVIEWS: YES
    dependencies:
      - package: Supabase
        product: Supabase
      - package: PlantyKit

  PlantyTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: PlantyTests
    dependencies:
      - target: Planty

schemes:
  Planty:
    build:
      targets:
        Planty: all
    test:
      targets:
        - PlantyTests
